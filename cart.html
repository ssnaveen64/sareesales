<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cart | NSS Textile</title>
<style>
:root{--wine:#7b1738;--wine-dark:#4c1027;--cream:#fff9f1;--ink:#2d2024;--muted:#756970;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#f9f3f5;min-height:100vh;}
a{color:inherit;text-decoration:none;}

.page-transition{position:fixed;inset:0;background:var(--wine-dark);z-index:9999;transform:translateY(-100%);transition:transform .5s cubic-bezier(.77,0,.18,1);}
.page-transition.active{transform:translateY(0);}

@keyframes fromTop{from{opacity:0;transform:translateY(-90px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fromBottom{from{opacity:0;transform:translateY(90px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-90px) scale(.85)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes fromRight{from{opacity:0;transform:translateX(90px) scale(.85)}to{opacity:1;transform:translateX(0) scale(1)}}
.from-top{animation:fromTop .7s cubic-bezier(.22,1,.36,1) both;}
.from-bottom{animation:fromBottom .7s cubic-bezier(.22,1,.36,1) both;}
.from-left{animation:fromLeft .7s cubic-bezier(.22,1,.36,1) both;}
.from-right{animation:fromRight .7s cubic-bezier(.22,1,.36,1) both;}

header{
  display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 6%;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px #0001;
}
.logo{font-family:Georgia,serif;font-size:26px;color:var(--wine);font-weight:bold;}
nav{display:flex;gap:20px;color:#4b3d42;font-size:14px;}
nav a{position:relative;padding-bottom:3px;}
nav a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--wine);transition:width .3s;}
nav a:hover::after{width:100%;}
nav a:hover{color:var(--wine);}
.cart-badge{border:1.5px solid var(--wine);color:var(--wine);border-radius:24px;padding:9px 16px;font-weight:bold;font-size:14px;}

main{padding:40px 6%;max-width:960px;margin:0 auto;}
.page-title{font:36px Georgia,serif;color:var(--wine-dark);margin-bottom:28px;animation:fromLeft .6s .1s cubic-bezier(.22,1,.36,1) both;}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.empty-cart{text-align:center;padding:80px 20px;animation:fadeSlideUp .6s ease both;}
.empty-cart .empty-icon{font-size:64px;margin-bottom:16px;}
.empty-cart p{color:var(--muted);font-size:16px;margin-bottom:20px;}
.empty-cart a{display:inline-block;padding:13px 28px;background:var(--wine);color:#fff;border-radius:6px;font-weight:bold;transition:background .3s;}
.empty-cart a:hover{background:var(--wine-dark);}

.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start;}
.cart-items{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 16px #4c102710;animation:fromLeft .65s .15s cubic-bezier(.22,1,.36,1) both;}
.cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;padding:18px 20px;border-bottom:1px solid #f0e9e6;align-items:center;transition:background .2s;}
.cart-item:last-child{border-bottom:none;}
.cart-item:hover{background:#fdf6f8;}
.item-img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#f6eeee;}
.item-details{}
.item-name{font-weight:600;font-size:15px;margin-bottom:4px;}
.item-color{font-size:12px;color:var(--muted);}
.item-price{font-weight:bold;color:var(--wine-dark);font-size:15px;margin-top:6px;}
.item-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.qty-controls{display:flex;align-items:center;gap:8px;background:#f9f3f5;border-radius:24px;padding:4px 8px;}
.qty-btn{background:none;border:none;color:var(--wine);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:bold;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.qty-btn:hover{background:var(--wine);color:#fff;}
.qty-num{font-weight:bold;min-width:20px;text-align:center;}
.remove-btn{background:none;border:none;color:#c0a0a8;cursor:pointer;font-size:13px;transition:color .2s;}
.remove-btn:hover{color:var(--wine);}

.summary-box{background:#fff;border-radius:14px;padding:26px;box-shadow:0 2px 16px #4c102710;position:sticky;top:90px;animation:fromRight .65s .2s cubic-bezier(.22,1,.36,1) both;}
.summary-box h3{font:22px Georgia,serif;color:var(--wine-dark);margin-bottom:20px;}
.summary-row{display:flex;justify-content:space-between;margin-bottom:14px;font-size:15px;color:var(--muted);}
.summary-row.total{font-weight:bold;font-size:18px;color:var(--ink);border-top:1px solid #f0e9e6;padding-top:14px;margin-top:6px;}
.checkout-btn{display:block;width:100%;margin-top:18px;padding:15px;background:linear-gradient(135deg,var(--wine),#a0204a);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:all .3s;text-align:center;}
.checkout-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #7b173840;}
.continue-link{display:block;text-align:center;margin-top:14px;color:var(--wine);font-size:14px;transition:color .2s;}
.continue-link:hover{color:var(--wine-dark);}

.toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#24151b,#4c1027);color:#fff;padding:14px 20px;border-radius:10px;display:none;box-shadow:0 8px 30px #0004;z-index:9998;font-size:14px;}
.toast.show{display:flex;align-items:center;gap:10px;}

footer{background:var(--wine-dark);color:#f9eaf0;padding:20px 6%;text-align:center;font-size:13px;margin-top:60px;}

@media(max-width:700px){
  .cart-layout{grid-template-columns:1fr;}
  .summary-box{position:static;}
  .cart-item{grid-template-columns:70px 1fr;}
  .item-actions{flex-direction:row;align-items:center;grid-column:1/-1;}
  .item-img{width:70px;height:70px;}
}
</style>
</head>
<body>
<div class="page-transition" id="pt"></div>

<header>
  <a class="logo" href="saree_store.html" onclick="navigate(event,'saree_store.html')">NSS Textile</a>
  <nav>
    <a href="saree_store.html" onclick="navigate(event,'saree_store.html')">Home</a>
    <a href="saree_store.html#shop" onclick="navigate(event,'saree_store.html')">Shop</a>
    <a href="add_saree.html" onclick="navigate(event,'add_saree.html')">Admin</a>
  </nav>
  <span class="cart-badge">🛒 Cart (<span id="cart-count">0</span>)</span>
</header>

<main>
  <h2 class="page-title">Your Cart 🛍️</h2>
  <div id="cart-root"></div>
</main>

<footer>© <span id="year"></span> NSS Textile. All rights reserved.</footer>
<div class="toast" id="toast"><span id="t-icon"></span><span id="t-msg"></span></div>

<script>
let cart = JSON.parse(localStorage.getItem("nss_cart")||"[]");
function save(){ localStorage.setItem("nss_cart",JSON.stringify(cart)); }
function updateCount(){ document.getElementById("cart-count").textContent=cart.reduce((s,i)=>s+i.qty,0); }

function render(){
  updateCount();
  const root=document.getElementById("cart-root");
  if(!cart.length){
    root.innerHTML=`<div class="empty-cart"><div class="empty-icon">🛒</div><p>Your cart is empty.</p><a href="saree_store.html" onclick="navigate(event,'saree_store.html')">Browse Sarees →</a></div>`;
    return;
  }
  const items = cart.map((item,i)=>`
    <div class="cart-item">
      <img class="item-img" src="${item.image}" alt="${item.name}" onerror="this.style.background='#f6eeee'">
      <div class="item-details">
        <div class="item-name">${item.name}</div>
        ${item.color?`<div class="item-color">Colour: ${item.color}</div>`:""}
        <div class="item-price">₹${(item.price*item.qty).toLocaleString("en-IN")}</div>
      </div>
      <div class="item-actions">
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeItem(${i})">🗑 Remove</button>
      </div>
    </div>`).join("");
  const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  root.innerHTML=`
    <div class="cart-layout">
      <div class="cart-items">${items}</div>
      <div class="summary-box">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal (${cart.reduce((s,i)=>s+i.qty,0)} items)</span><span>₹${subtotal.toLocaleString("en-IN")}</span></div>
        <div class="summary-row"><span>Shipping</span><span style="color:#2e7d32">Free</span></div>
        <div class="summary-row total"><span>Total</span><span>₹${subtotal.toLocaleString("en-IN")}</span></div>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>
        <a class="continue-link" href="saree_store.html" onclick="navigate(event,'saree_store.html')">← Continue Shopping</a>
      </div>
    </div>`;
}

function changeQty(i,d){ cart[i].qty+=d; if(cart[i].qty<=0) cart.splice(i,1); save(); render(); }
function removeItem(i){ cart.splice(i,1); save(); render(); showToast("🗑","Item removed from cart."); }
function checkout(){ showToast("🚀","Checkout coming soon! Connect a payment gateway."); }

function showToast(icon,msg){
  const t=document.getElementById("toast");
  document.getElementById("t-icon").textContent=icon;
  document.getElementById("t-msg").innerHTML=msg;
  t.classList.add("show");
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove("show"),2800);
}

function navigate(e,url){ e.preventDefault(); const pt=document.getElementById("pt"); pt.classList.add("active"); setTimeout(()=>window.location.href=url,450); }

document.getElementById("year").textContent=new Date().getFullYear();
render();
window.addEventListener("load",()=>{ const pt=document.getElementById("pt"); pt.style.transform="translateY(100%)"; setTimeout(()=>pt.style.display="none",600); });
</script>
</body>
</html>
